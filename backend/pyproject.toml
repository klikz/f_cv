[project]
name = "f-cv"
version = "0.1.0"
description = "F_CV — mahsulot sanash va uskuna ish vaqtini hisoblash tizimi"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tensorrt>=11.5.0.63",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "ultralytics>=8.4.219",
    "aiogram>=3.34.0",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "av>=19.0.2",
    "fastapi>=0.165.0",
    "numpy>=2.5.5",
    "nvidia-ml-py>=13.615.71",
    "onvif-zeep-async>=4.3.0",
    "opencv-python-headless>=5.1.0.95",
    "openpyxl>=3.1.5",
    "psutil>=7.2.2",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "redis>=8.2.0",
    "scipy>=1.18.1",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
    "wsdiscovery>=2.1.2",
    "psycopg[binary]>=3.3.9",
    "onnx>=1.23.2",
    "onnxslim>=0.1.99",
    "python-multipart>=0.0.34",
]

[project.scripts]
fcv = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "vision", "training", "telegram"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501", "ASYNC109", "SIM105", "B008", "RUF012", "ASYNC230", "ASYNC240", "RUF059"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[dependency-groups]
dev = [
    "httpx>=0.29.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }
